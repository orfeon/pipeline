# Profile: observe a BigQuery dataset and write one self-contained HTML report.
# Reads the public NYC yellow taxi trips (2022) — set `output` to your bucket and it runs.
# TABLESAMPLE keeps the scan small; the half-open date filter drops the few stray rows the
# table holds outside 2022 (they would otherwise add empty years to the time axis).
# The sink profiles every column in one pass with DataSketches (quantiles/histograms,
# distinct counts, top-K values, correlations, row samples). Each declared parameter adds
# a report section:
#   keys     → key diagnostics (distinct with bounds, keyness, containment between keys)
#   target   → every field related to a binary outcome (fields ranked by information value,
#              positive rate per bin/category, positive-vs-negative overlays). `tipped` is derived
#              in the query; payment_type will show up as a leak (cash tips are not recorded).
#   segments → per-group sub-profiles + a compare bar that overlays group distributions
#   time     → time-evolution view (per-bucket sub-profiles)
#   compare  → declared numeric pairs with overlaid distributions, Q-Q plot and PSI/KS
sources:
  - name: trips
    module: bigquery
    parameters:
      query: |
        SELECT
          vendor_id, pickup_datetime, dropoff_datetime, passenger_count, trip_distance,
          rate_code, store_and_fwd_flag, payment_type,
          fare_amount, extra, mta_tax, tip_amount, tolls_amount, total_amount,
          tip_amount > 0 AS tipped,
          pickup_location_id, dropoff_location_id
        FROM `bigquery-public-data.new_york_taxi_trips.tlc_yellow_trips_2022`
        TABLESAMPLE SYSTEM (1 PERCENT)
        WHERE pickup_datetime >= '2022-01-01' AND pickup_datetime < '2023-01-01'

sinks:
  - name: tripsProfile
    module: profile
    inputs: [trips]
    parameters:
      output: gs://mybucket/reports/taxi/trips-2022.html
      keys: [pickup_location_id, dropoff_location_id]
      target: tipped
      segments:
        - { field: payment_type, topK: 10 }
      time:
        field: pickup_datetime
        granularity: month
      compare:
        - [fare_amount, total_amount]
      report:
        title: NYC yellow taxi trips 2022
