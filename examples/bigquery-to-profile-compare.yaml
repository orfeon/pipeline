# Profile: compare two years of the same dataset.
# Both inputs are scanned and become the groups of the `inputs` axis (mode: compare). Each field
# of trips2022 is compared with the baseline trips2021 from exact counts over the same cells:
#   ks / tvd   how far apart the non-null values are distributed (numeric / categorical)
#   psi        the same over 10 equal-frequency bins
#   nullShift  the null rate of the input minus the baseline's — reported apart, because a field
#              whose values did not move and whose null rate did has a KS near 0
#   noiseKs / noisePsi  the sizes the statistics reach between two random samples of one
#              distribution at these row counts
#   sum, count exact, for reconciling the two inputs
# `tripsCompare.groups` holds one record per input × field; the default output carries the
# largest drift per field. `drift.exclude` keeps the fields that differ by construction (the
# year the inputs were split on) out of that ranking.
sources:
  - name: trips2021
    module: bigquery
    parameters:
      query: |
        SELECT
          vendor_id, pickup_datetime, dropoff_datetime, passenger_count, trip_distance,
          rate_code, store_and_fwd_flag, payment_type,
          fare_amount, extra, mta_tax, tip_amount, tolls_amount, total_amount,
          pickup_location_id, dropoff_location_id
        FROM `bigquery-public-data.new_york_taxi_trips.tlc_yellow_trips_2021`
        TABLESAMPLE SYSTEM (1 PERCENT)
        WHERE pickup_datetime >= '2021-01-01' AND pickup_datetime < '2022-01-01'
  - name: trips2022
    module: bigquery
    parameters:
      query: |
        SELECT
          vendor_id, pickup_datetime, dropoff_datetime, passenger_count, trip_distance,
          rate_code, store_and_fwd_flag, payment_type,
          fare_amount, extra, mta_tax, tip_amount, tolls_amount, total_amount,
          pickup_location_id, dropoff_location_id
        FROM `bigquery-public-data.new_york_taxi_trips.tlc_yellow_trips_2022`
        TABLESAMPLE SYSTEM (1 PERCENT)
        WHERE pickup_datetime >= '2022-01-01' AND pickup_datetime < '2023-01-01'

transforms:
  - name: tripsCompare
    module: profile
    inputs: [trips2021, trips2022]
    parameters:
      output:
        report: gs://mybucket/reports/taxi/trips-2021-vs-2022.html
        payload: gs://mybucket/reports/taxi/trips-2021-vs-2022.json
      run:
        dataset: taxi_trips
        partition: 2021-vs-2022
      mode: compare
      baseline: trips2021
      drift:
        exclude: [pickup_datetime, dropoff_datetime]
      keys: [pickup_location_id]
      compare:
        - [fare_amount, total_amount]
      report:
        title: NYC yellow taxi trips, 2021 vs 2022

sinks:
  - name: tripsCompareGroups
    module: bigquery
    inputs: [tripsCompare.groups]
    parameters:
      table: myproject.quality.profile_groups
      writeDisposition: WRITE_APPEND
